<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>VALOR | Auto Leaderboard</title>
<style>body{margin:0;background:#070000;color:#fff;font-family:Inter,sans-serif}.header{background:linear-gradient(135deg,#ff1a1a,#7a0000);padding:16px 20px;display:flex;gap:12px;align-items:center}.logo{width:48px;height:48px;background:#fff;color:#ff0f0f;border-radius:12px;display:grid;place-items:center;font-weight:900;font-size:26px}.container{max-width:900px;margin:auto;padding:16px}.card{background:#121212;border:1px solid #2a0000;border-radius:16px;overflow:hidden;margin-top:16px}.head{padding:12px 16px;background:#1a0000;font-weight:800;display:flex;justify-content:space-between}.row{padding:12px 16px;border-top:1px solid #222;display:flex;justify-content:space-between}.rank{color:#ffb700;background:rgba(255,183,0,.15);padding:4px 10px;border-radius:20px;font-weight:800;font-size:12px}.pts{color:#ff6b6b;font-weight:700}input{width:100%;padding:12px;background:#1a1a1a;border:1px solid #333;border-radius:10px;color:#fff;margin:10px 0;box-sizing:border-box}.footer{text-align:center;padding:20px;color:#888;margin-top:30px;border-top:1px solid #1a0000;background:#0f0000}</style>
</head><body>
<div class="header"><div class="logo">V</div><div><b>VALOR | Tier Testing & Scrims</b><br><small>1506313155226112093 • Since 30th Aug • discord.gg/8zrmebGnK • AUTO</small></div></div>
<div class="container">
<div class="card"><div class="head"><span>🏆 Global Top 10 - AUTO (Points & Ranks)</span><span id="c1" style="opacity:.6;font-size:11px"></span></div><div id="top10">Loading auto data since 30th Aug...</div></div>
<div class="card"><div class="head"><span>📊 Full Data - All Players AUTO</span><span id="c2" style="opacity:.6;font-size:11px"></span></div><div style="padding:0 16px"><input id="search" placeholder="Search player..." onkeyup="filter()"></div><div id="full"></div></div>
<div class="card"><div class="head">🔗 Join</div><div style="padding:16px;text-align:center"><iframe src="https://discord.com/widget?id=1506313155226112093&theme=dark" width="100%" height="300" frameborder="0"></iframe></div></div>
</div>
<div class="footer">A server for <b>Tier Testing</b> • Fully Automatic Since 30th Aug</div>
<script>
async function load(){ let r=await fetch('/api/leaderboard'); let data=await r.json(); data.sort((a,b)=>b.points-a.points); document.getElementById('c1').innerText=data.length+" players"; document.getElementById('c2').innerText=data.length+" total"; document.getElementById('top10').innerHTML=data.slice(0,10).map((p,i)=>`<div class="row"><span><b>#${i+1}</b> ${p.name}</span><span><span class="pts">${p.points} pts</span> ${p.wins}W-${p.losses}L <span class="rank">${p.rank}</span></span></div>`).join('')||"No results yet"; document.getElementById('full').innerHTML=data.map((p,i)=>`<div class="row" data-n="${p.name.toLowerCase()} ${p.rank.toLowerCase()}"><span>#${i+1} ${p.name} <small style="opacity:.5">${p.tag}</small></span><span>${p.points} <small>${p.wins}W-${p.losses}L</small> <span class="rank">${p.rank}</span></span></div>`).join('');}
function filter(){ let q=document.getElementById('search').value.toLowerCase(); document.querySelectorAll('#full.row').forEach(r=> r.style.display=r.getAttribute('data-n').includes(q)?'flex':'none');}
setInterval(load,5000); load();
</script></body></html>
